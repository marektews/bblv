# Weekly updates, one pull request per ecosystem, of versions released at
# least 14 days before, so that a broken or malicious release is usually
# withdrawn first.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ['*']
    ignore:
      # vue-tsc 3.3 cannot run TypeScript 7, the native compiler, which has
      # no lib/tsc; lift this once vue-tsc supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
