# Weekly updates, one pull request per ecosystem, of versions released at
# least 14 days before, so that a broken or malicious release is usually
# withdrawn first.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ['*']
    ignore:
      # vue-tsc 3.3 cannot run TypeScript 7, the native compiler, which has
      # no lib/tsc; lift this once vue-tsc supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # vue-tsc 3.3.14 reports TS2339 on reactive() bindings in a template
      # with // in a static attribute, e.g. placeholder="https://ntfy.sh"
      # (vuejs/language-tools#6322, #6352); lift this once it is fixed.
      - dependency-name: vue-tsc
        versions: ['3.3.14']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
