name: Release

# Pushing a tag such as v0.1.0 runs every check, builds the binaries with
# that version and publishes them with their SHA-256 sums as a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bblv
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum bblv-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/bblv-* dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --title "bblv $GITHUB_REF_NAME" --generate-notes
